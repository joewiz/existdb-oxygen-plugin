name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The plugin targets bytecode 17 (so it loads in Oxygen 26/27, which bundle Java 17),
      # but it is BUILT with JDK 21 because the Oxygen 28.x SDK jars are Java-21 bytecode.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and unit-test
        run: mvn -B verify

  integration:
    name: integration (Docker)
    runs-on: ubuntu-latest
    env:
      # Pinned trio image: eXist 7 + existdb-openapi carrying the behavior the plugin relies on
      # (create-on-PUT, the #71 query-error envelope, multipart install #49, collection export,
      # ft:fields, vector). Public on GHCR, so no docker login is needed. Provenance, the
      # behaviors it guarantees, the merge-down checklist, and the rebuild recipe are in
      # .github/trio-image.md — bump this digest there in lockstep when the trio advances.
      TRIO_IMAGE: ghcr.io/joewiz/existdb-trio@sha256:427fa2dd82a135da952db07544ef222cd889e0ca6495197b24f817c19a9a2630
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # ubuntu runners expose /var/run/docker.sock natively, so Testcontainers boots eXist 7.
      # The IT reads -Dexistdb.docker.image and caps the container at 4 GiB (see ExistClientIT).
      - name: Integration tests against the pinned trio image
        run: mvn -B verify -Pit -Dexistdb.docker.image=$TRIO_IMAGE
