name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The plugin targets bytecode 17 (so it loads in Oxygen 26/27, which bundle Java 17),
      # but it is BUILT with JDK 21 because the Oxygen 28.x SDK jars are Java-21 bytecode.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and unit-test
        run: mvn -B verify

  integration:
    name: integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # ubuntu runners expose /var/run/docker.sock natively, so Testcontainers boots eXist 7.
      - name: Integration tests against eXist 7 + existdb-openapi
        run: mvn -B verify -Pit
